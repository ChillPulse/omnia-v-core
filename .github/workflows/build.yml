name: OMNIA v2.0 Dual-MCU Build & DSP Tests

on:
  push:
    branches: [ "main", "wip/v2.2-direct-safety" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  dsp-unit-tests:
    name: Host DSP & Protocol Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile & Run Studio DSP + ASRC + Direct Protocol Suite
        run: |
          gcc -O2 -Wall -Wextra -Werror \
            -Ishared -Isrc/at32/include \
            tests/test_dsp_and_proto.c src/at32/dsp_engine.c src/at32/asrc_farrow.c \
            -lm -o tests/test_runner
          ./tests/test_runner
          gcc -O3 -ffast-math -Wall -Wextra -Werror \
            -Ishared -Isrc/at32/include \
            tests/test_dsp_and_proto.c src/at32/dsp_engine.c src/at32/asrc_farrow.c \
            -lm -o /tmp/omnia-dsp-fast
          /tmp/omnia-dsp-fast
          python -m unittest discover -s tests -p test_bench.py -v
          python -m unittest discover -s tests -p test_project_contract.py -v
          python -m unittest discover -s tests -p test_at32_sdk_lock.py -v
          gcc -O2 -Wall -Wextra -Werror -Isrc/esp32/include \
            tests/test_bench_command.c src/esp32/bench_command.c -o /tmp/omnia-bench-test
          /tmp/omnia-bench-test
          gcc -O2 -Wall -Wextra -Werror -Ishared -Isrc/esp32/include \
            tests/test_bridge_protocol.c -o /tmp/omnia-bridge-test
          /tmp/omnia-bridge-test
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ishared -Isrc/esp32/include \
            tests/test_bridge_protocol.c -o /tmp/omnia-bridge-san
          /tmp/omnia-bridge-san
          gcc -O2 -Wall -Wextra -Werror -Isrc/esp32/include \
            tests/test_ir_nec.c src/esp32/ir_nec.c -o /tmp/omnia-ir-test
          /tmp/omnia-ir-test
          gcc -O2 -Wall -Wextra -Werror -Itests/stubs -Ishared \
            tests/test_storage_disabled.c src/at32/spi_flash_sfdp.c -o /tmp/omnia-storage-test
          /tmp/omnia-storage-test
          gcc -O3 -ffast-math -Wall -Wextra -Werror -Ishared -Isrc/at32/include \
            tests/test_control_policy.c -o /tmp/omnia-policy-test
          /tmp/omnia-policy-test
          gcc -O3 -ffast-math -Wall -Wextra -Werror -Ishared -Isrc/at32/include \
            tests/test_dsp_validation.c src/at32/dsp_validation.c -o /tmp/omnia-validation-test
          /tmp/omnia-validation-test
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ishared -Isrc/at32/include \
            tests/test_dsp_validation.c src/at32/dsp_validation.c -o /tmp/omnia-validation-san
          /tmp/omnia-validation-san

  build-at32-dsp:
    name: Build AT32F403ACGU7 Studio DSP (PlatformIO)
    runs-on: ubuntu-latest
    needs: dsp-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-at32-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO & Build AT32F403 Firmware
        run: |
          pip install --upgrade platformio
          pio run -e at32f403_dsp
          python scripts/check_at32_elf.py .pio/build/at32f403_dsp/firmware.elf
          python tests/test_at32_elf_check.py .pio/build/at32f403_dsp/firmware.elf
      - name: Upload AT32F403 Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnia-at32f403-dsp-firmware
          path: |
            .pio/build/at32f403_dsp/firmware.bin
            .pio/build/at32f403_dsp/firmware.elf

  build-esp32s3-host:
    name: Build ESP32-S3-N16R8 Streamer (ESP-IDF v5.3)
    runs-on: ubuntu-latest
    needs: dsp-unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 Firmware via Official ESP-IDF v5.3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          command: idf.py build
      - name: Upload ESP32-S3 Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnia-esp32s3-streamer-firmware
          path: |
            build/omnia-v-core.bin
            build/omnia-v-core.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin

  build-esp32s3-platformio:
    name: Build ESP32-S3 (PlatformIO ESP-IDF 5.x)
    runs-on: ubuntu-latest
    needs: dsp-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO and build
        run: |
          pip install --upgrade platformio
          pio run -e esp32s3_omnia
      - uses: actions/upload-artifact@v4
        with:
          name: omnia-esp32s3-platformio-firmware
          path: |
            .pio/build/esp32s3_omnia/firmware.bin
            .pio/build/esp32s3_omnia/bootloader.bin
            .pio/build/esp32s3_omnia/partitions.bin
