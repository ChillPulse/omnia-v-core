name: OMNIA v2.0 Dual-MCU Build & DSP Tests

on:
  push:
    branches: [ "main", "wip/v2.2-direct-safety", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  dsp-unit-tests:
    name: Host DSP & Protocol Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile & Run Full Host Test Matrix (single source: tests/run_host_tests.sh)
        run: bash tests/run_host_tests.sh

  static-analysis:
    name: Static Analysis (gcc -fanalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gcc -fanalyzer on all host-buildable units
        run: |
          set -e
          for f in src/at32/dsp_engine.c src/at32/asrc_farrow.c src/at32/dsp_validation.c src/esp32/bench_command.c src/esp32/ir_nec.c; do
            echo "== analyzer: $f =="
            gcc -O2 -Wall -Wextra -fanalyzer -Ishared -Isrc/at32/include -Isrc/esp32/include -c "$f" -o /tmp/$(basename "$f" .c).o
          done
          echo "== analyzer: src/at32/spi_flash_sfdp.c (stubs HAL) =="
          gcc -O2 -Wall -Wextra -fanalyzer -Itests/stubs -Ishared -c src/at32/spi_flash_sfdp.c -o /tmp/spi_flash_sfdp.o

  build-at32-dsp:
    name: Build AT32F403ACGU7 Studio DSP (PlatformIO)
    runs-on: ubuntu-latest
    needs: dsp-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-at32-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO & Build AT32F403 Firmware
        run: |
          pip install --upgrade 'platformio==6.2.0'
          pio run -e at32f403_dsp
          python scripts/check_at32_elf.py .pio/build/at32f403_dsp/firmware.elf
          python tests/test_at32_elf_check.py .pio/build/at32f403_dsp/firmware.elf
      - name: Upload AT32F403 Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnia-at32f403-dsp-firmware
          path: |
            .pio/build/at32f403_dsp/firmware.bin
            .pio/build/at32f403_dsp/firmware.elf

  build-esp32s3-host:
    name: Build ESP32-S3-N16R8 Streamer (ESP-IDF v5.3)
    runs-on: ubuntu-latest
    needs: dsp-unit-tests
    steps:
      - uses: actions/checkout@v4
      # espressif/esp-idf-ci-action v1.2.0 (пин по полному SHA — тег может двигаться)
      - name: Build ESP32-S3 Firmware via Official ESP-IDF v5.3
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5
        with:
          esp_idf_version: v5.3
          target: esp32s3
          command: idf.py build
      - name: Upload ESP32-S3 Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnia-esp32s3-streamer-firmware
          path: |
            build/omnia-v-core.bin
            build/omnia-v-core.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin

  build-esp32s3-platformio:
    name: Build ESP32-S3 (PlatformIO ESP-IDF 5.x)
    runs-on: ubuntu-latest
    needs: dsp-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO and build
        run: |
          pip install --upgrade 'platformio==6.2.0'
          pio run -e esp32s3_omnia
      - uses: actions/upload-artifact@v4
        with:
          name: omnia-esp32s3-platformio-firmware
          path: |
            .pio/build/esp32s3_omnia/firmware.bin
            .pio/build/esp32s3_omnia/bootloader.bin
            .pio/build/esp32s3_omnia/partitions.bin
