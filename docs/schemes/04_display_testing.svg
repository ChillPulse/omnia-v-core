   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="35.7264" y="36.673448" transform="rotate(-0 35.7264 36.673448)">05  ДИСПЛЕЙ I80 И КОНТРОЛЬНЫЕ ТОЧКИ</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a02524" x="35.7264" y="85.369132" transform="rotate(-0 35.7264 85.369132)">НАЗНАЧЕНИЯ В ПРОЕКТЕ • Не паять дисплей по старому рисунку: распиновка FFC и режимы не подтверждены</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #516172" x="35.7264" y="831.57984" transform="rotate(-0 35.7264 831.57984)">OMNIA • Direct v2.2  |  Проектные соединения, без аппаратной приёмки  |  См. SCHEMES_INDEX_RU.md</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #516172" x="1155.1536" y="831.57984" transform="rotate(-0 1155.1536 831.57984)">5 / 5</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #143a58" x="50.01696" y="138.640985" transform="rotate(-0 50.01696 138.640985)">A. Дисплей ST7789 · карта сигналов ESP</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 180.589828)">D0 GPIO9    D1 GPIO10    D2 GPIO11    D3 GPIO12</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 197.089828)">D4 GPIO13  D5 GPIO14    D6 GPIO21    D7 GPIO47</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 213.589828)">WR GPIO38  •  DC GPIO46  •  RST GPIO3  •  BL GPIO45</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 229.214984)">CS и RD: аппаратное назначение требует проверки.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #a02524" transform="translate(59.544 296.93288)">Подписи на фото модуля не устанавливают надёжно</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #a02524" transform="translate(59.544 312.600848)">нумерацию/ориентацию FFC, распиновку подсветки</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #a02524" transform="translate(59.544 328.442723)">и электрический режим. Подтвердить IM0/1/2, трассы,</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #a02524" transform="translate(59.544 344.192723)">питание, тип шлейфа и схему до пайки.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 414.686048)">GPIO3/45/46 — strap; проверить уровни на старте.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 430.527923)">Готового драйвера I80 и теста экрана ещё нет.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #143a58" x="621.63936" y="138.572079" transform="rotate(-0 621.63936 138.572079)">B. Контроль связки до усилителя</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(631.1664 179.117359)">1  Питание отключено: проверить GND и перемычки.</text>
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(631.1664 195.017359)">2  Подать корректное питание; измерить напряжения</text>
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(631.1664 211.101203)">    и отсутствие обратного питания при выключениях.</text>
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(631.1664 227.001203)">3  Проверить UART и статусы, без УМЗЧ и K2.</text>
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(631.1664 242.901203)">4  При 48 кГц и 2 × 32-бит: LRCK ≈ 48 кГц,</text>
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(631.1664 258.801203)">    BCLK ≈ 3,072 МГц; сравнить оба приёмника.</text>
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(631.1664 274.447797)">5  Проверить данные PB14 и PB15, L/R ЦАПа и</text>
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(631.1664 290.417359)">    штатное состояние XSMT конкретного модуля.</text>
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(631.1664 306.317359)">6  Только затем поэтапно подключать остальные узлы.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #9a6510" x="50.01696" y="534.230585" transform="rotate(-0 50.01696 534.230585)">C. Действительные сведения против предположений</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 566.224542)">Требование Direct и номера GPIO сверены с текущим ТЗ / shared/omnia_pins.h. Клоки, питание, обвязка,</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 582.120558)">устойчивость DMA, качество звука, безопасный mute и работа выбранного ST-Link не испытаны на устройстве.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 597.870558)">Bluetooth и его распиновка/прошивка отложены до фото модуля; PA3 — резерв под будущий MCLK.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #143a58" x="50.01696" y="728.20636" transform="rotate(-0 50.01696 728.20636)">D. Ссылки на подробную ведомость и решения</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #162536" x="59.544" y="759.721528" transform="rotate(-0 59.544 759.721528)">SCHEMES_INDEX_RU.md • CORE_SIGNAL_NETS_RU.md • AMP_CONTROL_SAFETY.md • START_HERE_RU.md</text>
   </g>
  </g>
 </g>
