   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="35.7264" y="34.913878" transform="rotate(-0 35.7264 34.913878)">04  USB, ЦАП И УСИЛИТЕЛЬ: ГРАНИЦЫ ПОДКЛЮЧЕНИЯ</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a02524" x="35.7264" y="85.522101" transform="rotate(-0 35.7264 85.522101)">ЭТИ УЗЛЫ НЕ ПРОШЛИ АППАРАТНУЮ ПРОВЕРКУ • Силовая часть и конкретный вход УМЗЧ требуют отдельной схемы</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #516172" x="35.7264" y="831.57984" transform="rotate(-0 35.7264 831.57984)">OMNIA • Direct v2.2  |  Проектные соединения, без аппаратной приёмки  |  См. SCHEMES_INDEX_RU.md</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #516172" x="1155.1536" y="831.57984" transform="rotate(-0 1155.1536 831.57984)">4 / 5</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #143a58" x="50.01696" y="138.572079" transform="rotate(-0 50.01696 138.572079)">A. Два разных USB-контроллера</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 171.09595)">ESP GPIO19 D− / GPIO20 D+ → Host MSC</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 186.18895)">Линии уже на штатном native USB-C платы YD.</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 201.877512)">Не вешать второе гнездо параллельно без схемы.</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 217.297137)">Питание VBUS, ток, защита, CC и маршрутизация</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 233.077512)">определяются после выбора топологии.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 305.76475)">AT32 PA11 D− / PA12 D+ → USB-DAC UAC1</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 321.42325)">Штатный USB-C может быть связан с 5 В платы;</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 335.418562)">до подключения проверить трассы и исключить</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 352.146312)">встречное питание. Оба USB ещё не готовы.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #143a58" x="621.63936" y="138.640985" transform="rotate(-0 621.63936 138.640985)">B. Детектор VBUS · проект, не готовый монтаж</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(631.1664 171.617012)">USB-DAC VBUS (+5 В) → R1 10 кΩ → точка S → PB9</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(631.1664 188.673028)">Точка S → R2 15 кΩ → GND</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(631.1664 205.173028)">Точка S → C1 100 нФ → GND</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #a02524" transform="translate(631.1664 279.894295)">При 5,0 В расчётно S ≈ 3,0 В; допуски, диапазон</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #a02524" transform="translate(631.1664 295.263827)">VBUS, ток утечки и состояние выключенного AT32</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #a02524" transform="translate(631.1664 310.713827)">проверить отдельно. Нельзя считать VBUS на</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #a02524" transform="translate(631.1664 326.163827)">штатном USB-C изолированным от 5 В платы.</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #a02524" transform="translate(631.1664 342.152162)">Общая GND ≠ гальваническая изоляция.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #143a58" x="50.01696" y="441.645785" transform="rotate(-0 50.01696 441.645785)">C. Аналоговый выход PCM5102A</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 473.592937)">Модуль LOUT → линейный вход L усилителя</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 489.192937)">Модуль ROUT → линейный вход R усилителя</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 504.792937)">Аналоговая земля по схеме конкретного устройства.</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 520.392938)">Опциональный K1 (PB8) — сигнальное реле L/R.</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 535.901937)">Оно не защищает акустику от аварии УМЗЧ.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a02524" x="59.544" y="599.53718" transform="rotate(-0 59.544 599.53718)">Усилитель подключать только после отдельной проверки.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #143a58" x="621.63936" y="441.576879" transform="rotate(-0 621.63936 441.576879)">D. Силовое реле и Mute — независимы</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(631.1664 473.592937)">PB2 → рассчитанный драйвер → катушка K2</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(631.1664 489.101937)">K2 управляет питанием УМЗЧ; GPIO ≠ катушка!</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(631.1664 504.792937)">PB4 → согласующий узел → MUTE / SDZ / RESET</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(631.1664 520.482312)">PB8 → драйвер необязательного сигнального K1</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(631.1664 536.082312)">PB0 → XSMT DAC при подходящей обвязке.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a02524" x="631.1664" y="599.623977" transform="rotate(-0 631.1664 599.623977)">Полярность и обвязка зависят от конкретной платы.</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a02524" x="50.01696" y="677.316185" transform="rotate(-0 50.01696 677.316185)">E. Почему нет универсальной схемы силового узла</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 709.263337)">Для K2 и PB4 нужны параметры реальной катушки, платы УМЗЧ и входов. CMUTE, MUTE, SDZ и RESET не взаимозаменяемы.</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 724.952712)">Для питания 230 В необходимы изоляция, защита и расчёт контактов с учётом пускового тока.</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(59.544 740.463337)">Реле K1 и программный Mute не заменяют независимую защиту динамиков от аварии усилителя.</text>
   </g>
  </g>
 </g>
