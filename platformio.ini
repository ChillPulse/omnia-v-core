; ==============================================================================
; OMNIA Flagship Streamer & Studio DSP v2.0 — Unified PlatformIO Monorepo
; 1) [env:esp32s3_omnia] — ESP32-S3-N16R8 (16MB Flash + 8MB Octal PSRAM, ESP-IDF 5.x, БЕЗ Arduino)
; 2) [env:at32f403_dsp]  — WeAct AT32F403ACGU7 BlackPill (240 MHz Cortex-M4F, 224 KB SRAM, 1MB Flash)
; ==============================================================================

[platformio]
default_envs = at32f403_dsp, esp32s3_omnia

; ------------------------------------------------------------------------------
; Ядро 1: Сетевой стример, Gapless/Radio/USB декодер, LVGL I80 60FPS и Web-UI PWA
; ------------------------------------------------------------------------------
[env:esp32s3_omnia]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter =
    -<*>
    +<esp32/>
build_flags =
    -O3
    -flto
    -DBOARD_HAS_PSRAM
    -Ishared
    -Isrc/esp32/include
monitor_speed = 115200

; ------------------------------------------------------------------------------
; Ядро 2: Изолированный тактовый мастер I2S2 и 9-звенный студийный DSP (240 МГц)
; ------------------------------------------------------------------------------
[env:at32f403_dsp]
platform = https://github.com/ArteryTek/platform-arterytekat32.git
board = genericAT32F403ACGU7
framework = at32firmlib
board_build.f_cpu = 240000000L
board_build.ldscript = ldscripts/AT32F403ACGU7_OMNIA.ld
build_src_filter =
    -<*>
    +<at32/>
build_flags =
    -O3
    -ffast-math
    -Ishared
    -Isrc/at32/include
    -lm
; Программатор по умолчанию: CMSIS-DAP / DAPLink (для ST-Link V2 замените на stlink)
upload_protocol = cmsis-dap
